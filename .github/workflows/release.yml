name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  # The gates run without the publish token in scope. The build toolchain here
  # is large — vitest pulls rollup, vite, postcss and friends — and none of it
  # has any business executing in the same job that holds a credential able to
  # publish to npm.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:types
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      # The published READMEs are the first thing an integrator runs. Three
      # bugs have been filed for examples that did not compile, so this gates
      # the publish as well as the PR.
      - run: pnpm check:docs
      - run: pnpm check:packaging
      - name: The published packages install, compile and load for a consumer
        run: pnpm check:consumer
      # The gap the parity comparator exists to close is exactly the gap a
      # release reopens, so it gates the publish and not only the PR.
      - name: SDK write surface against the frontend's
        run: pnpm parity:check

  # `changeset publish` reads the *current* package.json version and skips
  # anything already on npm — it does not read the pending changeset files or
  # bump anything itself. Calling it straight from a push to main, with the
  # manifests still at their pre-release version, is a silent no-op: both
  # packages here are already published at their current manifest version, so
  # this job would report success and ship nothing.
  #
  # `changesets/action` is what closes that gap, and it runs one of two ways
  # depending on what it finds:
  #   - pending changesets exist  -> runs `version`, which bumps the
  #     manifests, updates CHANGELOG.md and deletes the consumed changeset
  #     files, then opens (or updates) a "Version Packages" pull request with
  #     that diff. Nothing is published on this run.
  #   - no pending changesets     -> a Version Packages PR was just merged, so
  #     the manifests already carry the release version. Runs `publish`,
  #     which is the real npm publish.
  # A push to main after this PR merges will do the former; merging the
  # Version Packages PR that produces is what triggers the latter.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Lets npm attach a provenance attestation, so a consumer can verify
      # which commit and which workflow produced the tarball.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets/action needs the full history to compute the changeset
          # diff against the base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `changesets/action` sees that GitHub can mint an OIDC token and elects
      # to publish through npm trusted publishing. It then hands the work to
      # `npm publish`, and OIDC publishing needs npm 11.5.1 or newer — the npm
      # that ships with Node 20 is 10.x, which has no such support. The result
      # is a publish with no credential at all: the registry asks for a
      # one-time password and the job dies with EOTP, as the 2.0.0 release did
      # twice. Upgrading npm is what makes the trusted publisher usable.
      #
      # Pinned to the 11 line rather than `latest`: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, so `npm@latest` cannot install on the
      # Node 20 this job runs. npm 11 declares `^20.17.0 || >=22.9.0` and its
      # current release is well past the 11.5.1 that introduced OIDC.
      - run: npm install -g npm@11
      - run: npm --version

      - name: Version Packages PR, or publish once one has been merged
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both, and they are not interchangeable. `setup-node` writes an
          # .npmrc that reads `NODE_AUTH_TOKEN`, which is what `npm publish`
          # itself uses. `changesets/action` makes its own decision earlier:
          # it looks for `NPM_TOKEN`, and finding none it logs "No NPM_TOKEN
          # found, but OIDC is available" and switches to npm trusted
          # publishing. That path needs a trusted publisher configured on the
          # npm side; without one the registry falls back to asking for a
          # one-time password and the publish dies with EOTP.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
