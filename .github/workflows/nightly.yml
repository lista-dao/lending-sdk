name: Nightly chain checks

# Network-dependent, so not a PR gate: a public RPC hiccup must not block a
# merge. These catch drift between our ABIs and what is actually deployed,
# which no unit test can see.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # Everything below that touches a chain needs BSC_RPC_URL, and the repository
  # does not have it yet. Without this gate the nightly mails "All jobs have
  # failed" every morning for a configuration gap, and a report that is red by
  # default is one nobody reads on the morning it means something.
  #
  # To turn the chain checks on, add BSC_RPC_URL (and ETH_RPC_URL for the
  # Ethereum reads) under Settings → Secrets and variables → Actions. Use a key
  # minted for CI rather than a personal one: this repository is public, and
  # while secrets are not exposed to forked pull requests, any workflow on the
  # default branch can reach them.
  gate:
    runs-on: ubuntu-latest
    outputs:
      bsc: ${{ steps.probe.outputs.bsc }}
      eth: ${{ steps.probe.outputs.eth }}
    steps:
      - id: probe
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          # Only ever tests emptiness — the values are never echoed.
          for chain in bsc eth; do
            var=$(echo "$chain" | tr '[:lower:]' '[:upper:]')_RPC_URL
            if [ -n "${!var}" ]; then
              echo "$chain=true" >> "$GITHUB_OUTPUT"
            else
              echo "$chain=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=$var is not set::Chain checks needing $var are skipped. Add it under Settings → Secrets and variables → Actions."
            fi
          done

  abi-conformance:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # This one resolves selectors against bundled deployment data and needs
      # no RPC, so it runs whether or not the secret is configured.
      - name: ABI selectors resolve on their deployments
        run: pnpm abi:conformance
      - name: Every public read returns a usable shape
        if: needs.gate.outputs.bsc == 'true'
        run: pnpm read:surface
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

  fork-check:
    needs: gate
    if: needs.gate.outputs.bsc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Authorization and migration flows require a mainnet fork.
      - name: Authorization and migration flows on a BSC fork
        run: pnpm fork:check
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}

  fork-flows:
    needs: gate
    if: needs.gate.outputs.bsc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Executed, with the resulting state asserted — not just encoded. These
      # need a market with real depth and, for liquidation, a position that is
      # actually unhealthy.
      - name: Vault, Smart Lending and liquidation on a BSC fork
        run: pnpm fork:flows
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
